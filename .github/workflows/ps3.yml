name: PS3 build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Pinned so the cached toolchain only rebuilds when these are bumped on purpose
  # (the same refs as thug-ps3's workflow).
  PS3TOOLCHAIN_REF: de85d7d5d11dc0a99d823ece3d440eea46c34d0f
  PSL1GHT_REF: f649a08fd536a9e27c08c7db2d93a2d7ee4c3bbe
  TOOLCHAIN_CACHE_KEY: ps3dev-v1-de85d7d5-f649a08f
  # NZ:P's game code and data, at the revisions this port was made against
  # (vril/ holds the engine, vendored from nzp-team/vril-engine 7a31c3d).
  QUAKEC_REPO: nzp-team/quakec
  QUAKEC_REF: cc260a86dfbea2aea4708da63d67ae52adf722d6
  ASSETS_REPO: nzp-team/assets
  ASSETS_REF: f59187789f3d83f0502ac61dbc8bf7105daa4ff0

jobs:
  toolchain:
    name: PS3 toolchain (cached)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Look for the cached toolchain
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ps3dev
          key: ${{ env.TOOLCHAIN_CACHE_KEY }}
          lookup-only: true

      - name: Install build requirements
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get -y install \
            autoconf automake bison flex gcc g++ libelf-dev make texinfo \
            libncurses-dev patch python3 python-is-python3 python3-dev \
            wget zlib1g-dev libtool-bin bzip2 libgmp-dev pkg-config libssl-dev

      - name: Fetch ps3toolchain and PSL1GHT
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/ps3dev/ps3toolchain "$RUNNER_TEMP/ps3toolchain"
          git -C "$RUNNER_TEMP/ps3toolchain" checkout "$PS3TOOLCHAIN_REF"
          git clone https://github.com/ps3dev/PSL1GHT "$RUNNER_TEMP/psl1ght"
          git -C "$RUNNER_TEMP/psl1ght" checkout "$PSL1GHT_REF"

      - name: Set up environment
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          echo "PS3DEV=$RUNNER_TEMP/ps3dev" >> "$GITHUB_ENV"
          echo "PSL1GHT=$RUNNER_TEMP/ps3dev" >> "$GITHUB_ENV"
          echo "BUILD_PS3TOOLCHAIN_ONLY=1" >> "$GITHUB_ENV"
          echo "NO_SAVANNAH=1" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/ps3dev/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/ps3dev/ppu/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/ps3dev/spu/bin" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/ps3dev"

      - name: Download toolchain sources
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}/ps3toolchain
        run: mkdir -p build && cd build && ../download.sh

      - name: Binutils (PPU)
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}/ps3toolchain
        run: ./toolchain.sh 001
      - name: GCC + newlib (PPU)
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}/ps3toolchain
        run: ./toolchain.sh 002
      - name: Symlinks (PPU)
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}/ps3toolchain
        run: ./toolchain.sh 004
      - name: Binutils (SPU)
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}/ps3toolchain
        run: ./toolchain.sh 005
      - name: GCC + newlib (SPU)
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}/ps3toolchain
        run: ./toolchain.sh 006

      - name: PSL1GHT
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}/psl1ght
        run: make install-ctrl && make && make install

      - name: Save toolchain to cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ps3dev
          key: ${{ env.TOOLCHAIN_CACHE_KEY }}

  shaders:
    name: RSX programs assemble (cgcomp -a)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build PSL1GHT's cgcomp (assembler mode needs no NVIDIA Cg)
        run: |
          git clone -q https://github.com/ps3dev/PSL1GHT "$RUNNER_TEMP/psl1ght"
          git -C "$RUNNER_TEMP/psl1ght" checkout -q "$PSL1GHT_REF"
          make -s -C "$RUNNER_TEMP/psl1ght/tools/cgcomp"
      - name: Assemble every program, checking instruction counts
        run: |
          python3 vril/source/platform/ps3/tools/build_shaders.py \
            "$RUNNER_TEMP/psl1ght/tools/cgcomp/cgcomp" "$RUNNER_TEMP/ps3gl_shader_data.h" \
            vril/source/platform/ps3/rsx/shaders
          grep -c '_fpo\[\]\|_vpo\[\]' "$RUNNER_TEMP/ps3gl_shader_data.h"

  game:
    name: NZ:P PS3 EBOOT + PKG
    needs: toolchain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Restore toolchain
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ps3dev
          key: ${{ env.TOOLCHAIN_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Set up environment
        run: |
          sudo apt-get update && sudo apt-get -y install libelf-dev python3 zip
          echo "PS3DEV=$RUNNER_TEMP/ps3dev" >> "$GITHUB_ENV"
          echo "PSL1GHT=$RUNNER_TEMP/ps3dev" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/ps3dev/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/ps3dev/ppu/bin" >> "$GITHUB_PATH"

      - name: cgcomp
        run: |
          if [ ! -x "$RUNNER_TEMP/ps3dev/bin/cgcomp" ]; then
            git clone -q https://github.com/ps3dev/PSL1GHT "$RUNNER_TEMP/psl1ght-src"
            git -C "$RUNNER_TEMP/psl1ght-src" checkout -q "$PSL1GHT_REF"
            make -s -C "$RUNNER_TEMP/psl1ght-src/tools/cgcomp"
            echo "CGCOMP_BIN=$RUNNER_TEMP/psl1ght-src/tools/cgcomp/cgcomp" >> "$GITHUB_ENV"
          else
            echo "CGCOMP_BIN=$RUNNER_TEMP/ps3dev/bin/cgcomp" >> "$GITHUB_ENV"
          fi

      - name: Build
        working-directory: vril
        run: |
          set -o pipefail
          ppu-gcc --version | head -1
          make -f Makefile.ps3 CGCOMP_BIN="$CGCOMP_BIN" -k -j"$(nproc)" self 2>&1 | tee build.log

      # The errors also go into annotations: readable through the API (gh api
      # .../check-runs/<id>/annotations) where the raw logs aren't.
      - name: Report errors
        if: failure()
        working-directory: vril
        run: |
          grep -E 'error|undefined reference|multiple definition|No rule|Error [0-9]' build.log \
            | grep -v '^\s*|' | awk '!seen[$0]++' | head -120 > errors.txt || true
          for part in 0 1 2 3; do
            chunk=$(sed -n "$((part*30+1)),$((part*30+30))p" errors.txt)
            [ -n "$chunk" ] || break
            printf '::error title=build errors %d::%s\n' "$part" \
              "$(printf '%s' "$chunk" | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          done

      - name: Link checks (TOC, sizes)
        working-directory: vril
        run: |
          elf=build/ps3/nzportable.elf
          echo "::notice title=r2off TOC-split stubs (must be 0)::$(ppu-nm $elf | grep -c r2off || true)"
          echo "::notice title=.got size::$(ppu-readelf -SW $elf | awk '$2==".got"{print $6}')"
          ppu-size $elf
          ppu-nm -C --defined-only $elf | sort > nzportable.map

      - name: Fetch quakec and assets
        run: |
          git clone -q --filter=blob:none "https://github.com/$QUAKEC_REPO" "$RUNNER_TEMP/quakec"
          git -C "$RUNNER_TEMP/quakec" checkout -q "$QUAKEC_REF"
          git clone -q --filter=blob:none "https://github.com/$ASSETS_REPO" "$RUNNER_TEMP/assets"
          git -C "$RUNNER_TEMP/assets" checkout -q "$ASSETS_REF"

      # What quakec's tools/qc-compiler-gnu.sh does, without its rule that any
      # warning fails the build: the result is checked by progs.dat existing.
      - name: Compile progs.dat (FTEQCC)
        working-directory: ${{ runner.temp }}/quakec
        run: |
          chmod +x bin/fteqcc-cli-lin
          pip install --quiet "pandas<3" fastcrc colorama   # pandas 3 copy-on-write breaks its in-place hashing
          python3 bin/qc_hash_generator.py -i tools/asset_conversion_table.csv -o source/server/hash_table.qc
          mkdir -p build/fte build/standard
          bin/fteqcc-cli-lin -O3 -Ono-compound_jumps -Wall -srcfile progs/ssqc.src > qc.log 2>&1 || true
          # progs_dat is "../build/standard/progs.dat": find where that resolved to
          dat=$(find "$RUNNER_TEMP" -name progs.dat -newer qc.log -o -name progs.dat -path '*standard*' | head -1)
          if [ -z "$dat" ] || [ ! -s "$dat" ]; then
            printf '::error title=fteqcc::%s\n' "$(grep -v '^including' qc.log | tail -n 40 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
          echo "progs.dat: $dat"
          mkdir -p "$RUNNER_TEMP/progs"
          cp "$dat" "$RUNNER_TEMP/progs/"
          cp "$(dirname "$dat")/progs.lno" "$RUNNER_TEMP/progs/" 2>/dev/null || true
          grep -v '^including' qc.log | tail -n 5

      - name: Assemble game data
        run: |
          # As the assets repo assembles the PC data: pc/nzp first, then common/
          # without overwriting what the PC set already has.
          mkdir -p "$RUNNER_TEMP/nzp"
          cp -r "$RUNNER_TEMP/assets/pc/nzp/." "$RUNNER_TEMP/nzp/"
          cp -rn "$RUNNER_TEMP/assets/common/." "$RUNNER_TEMP/nzp/"
          cp "$RUNNER_TEMP"/progs/* "$RUNNER_TEMP/nzp/"
          # PS3 default on top of the PC config: PlayStation button icons
          printf '\n// PS3\nseta cl_controllerglyphs "sony"\n' >> "$RUNNER_TEMP/nzp/autoexec.cfg"
          du -sh "$RUNNER_TEMP/nzp"

      - name: PKG (EBOOT + game data)
        working-directory: vril
        run: |
          make -f Makefile.ps3 CGCOMP_BIN="$CGCOMP_BIN" DATA_DIR="$RUNNER_TEMP/nzp" pkg
          # the data must be in what was packed, file for file
          src=$(find "$RUNNER_TEMP/nzp" -type f | wc -l)
          packed=$(find build/ps3/package/pkg/USRDIR/nzp -type f | wc -l)
          echo "::notice title=game data::$src files assembled, $packed in the PKG, $(du -sh build/ps3/nzportable.gnpdrm.pkg | cut -f1) PKG"
          echo "::notice title=sizes::data $(du -sb "$RUNNER_TEMP/nzp" | cut -f1) B, packed $(du -sb build/ps3/package/pkg | cut -f1) B, pkg $(stat -c %s build/ps3/nzportable.pkg) B, gnpdrm $(stat -c %s build/ps3/nzportable.gnpdrm.pkg) B; $(cd build/ps3/package/pkg/USRDIR/nzp && du -sb * | awk '{printf "%s=%d ", $2, $1}')"
          for f in gfx/palette.lmp textures/particles/particlefont.tga progs.dat default.cfg; do
            [ -f "build/ps3/package/pkg/USRDIR/nzp/$f" ] || { echo "::error title=missing from PKG::$f"; exit 1; }
          done
          [ "$src" -eq "$packed" ] || { echo "::error title=game data::only $packed of $src files packed"; exit 1; }
          cp build/ps3/nzportable.gnpdrm.pkg ../nzp-ps3.pkg

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nzp-ps3
          retention-days: 3  # the account's Actions storage is small (~60 MB a run)
          path: |
            nzp-ps3.pkg
            vril/build/ps3/nzportable.self
            vril/nzportable.map
            vril/build.log
          if-no-files-found: warn
